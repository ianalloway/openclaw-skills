name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run skill smoke tests
        run: python3 tests/validate_skills.py

      - name: Test safe installation
        run: python3 -m unittest discover -s tests -p 'test_*.py'
